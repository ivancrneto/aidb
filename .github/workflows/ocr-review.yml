# OpenCodeReview - GitHub Actions PR Auto-Review Demo
#
# Demonstrates invoking the reusable action for both automatic PR review
# (pull_request_target: opened/synchronize/reopened) and on-demand re-review
# via comments starting with '/open-code-review' or '@open-code-review'.
#
# Required secrets/vars (Settings -> Secrets and variables -> Actions):
#   secret    OCR_LLM_URL            https://openrouter.ai/api/v1/chat/completions
#   secret    OCR_LLM_AUTH_TOKEN     OpenRouter API key (sk-or-...)
#   variable  OCR_LLM_MODEL          anthropic/claude-sonnet-5
#   variable  OCR_LLM_USE_ANTHROPIC  false  (OpenRouter is OpenAI-compatible)
#   variable  OCR_APPROVE_MAX_FINDINGS  optional; default 5. Approve when every
#                                    finding is low/medium and count ≤ this.
#
# Verified against alibaba/open-code-review@bccbc15f785269400735d5255540c231e6c02b6d
# action.yml (do not rename without re-checking that commit):
#   inputs.route_severity_below — 'medium' routes medium AND low to the sticky
#     summary; empty/unknown disables routing (findings stay inline).
#   /tmp/ocr-result.json — stdout capture of `ocr review` in the action's
#     "Run OCR" step; approve logic expects comments[].severity and
#     manifest.input.resolved_head (or requested_head). Prefer re-pinning the
#     action over inventing a parallel schema.
#
# Auto-APPROVE posts an actual GitHub review event: APPROVE when findings are
# empty or only low/medium within OCR_APPROVE_MAX_FINDINGS. Requires repo
# Settings → Actions → General → Workflow permissions:
#   - Read and write permissions
#   - "Allow GitHub Actions to create and approve pull requests" checked
# Same-repo OWNER/MEMBER/COLLABORATOR authors only. Pair with branch
# protection that still requires a human reviewer so a bot APPROVE alone
# cannot satisfy merge gates.

name: OpenCodeReview PR Review

# Conditional concurrency group.
#
# GitHub Actions evaluates concurrency BEFORE job-level if-conditions. With a
# flat group (ocr-<pr_number>), every comment on the PR — even an unrelated
# conversation reply that will be skipped — enters the same group and, because
# cancel-in-progress is true, cancels any in-progress review. The result: a
# single normal comment kills a running review, and you see "two runs, one
# cancelled" in the Actions tab.
#
# Fix: matching events (PR events + /open-code-review comments) share a per-PR
# group so a new review cancels any stale one for the same PR. Non-matching
# comments land in a unique noop-<run_id> group that can never collide with a
# real review, so they are skipped instantly without disrupting anything.
concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  # Use pull_request_target instead of pull_request so that secrets are
  # available even for PRs from forks. This is safe because the reusable
  # action only reads the diff and does not execute any code from the PR.
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run on PR events, or on human-authored comments starting with trigger
    # keywords. Bot comments are excluded as a safety net: GITHUB_TOKEN already
    # suppresses events from bot-posted comments, but a PAT/App token would not.
    # issue_comment triggers are further gated on author_association so only
    # MEMBER/OWNER/COLLABORATOR users can spend LLM quota via re-review.
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            // For issue_comment events, resolve PR base/head so the action
            // can review the right diff (issue_comment has no top-level
            // pull_request payload fields).
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      # The composite action skips setup-node when the runner already has Node,
      # then `npm install -g` can omit the optional linux binary. Force Node 24
      # and install the platform package so `ocr` can spawn opencodereview.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Preinstall OpenCodeReview linux binary
        run: |
          npm install -g \
            "@alibaba-group/open-code-review@1.12.9" \
            "@alibaba-group/ocr-linux-x64@1.12.9"
          NPM_GLOBAL_BIN="$(npm config get prefix)/bin"
          if [ -z "$NPM_GLOBAL_BIN" ] || [ "$NPM_GLOBAL_BIN" = "/bin" ]; then
            echo "::error::could not resolve npm global bin directory"
            exit 1
          fi
          echo "$NPM_GLOBAL_BIN" >> "$GITHUB_PATH"
          export PATH="$NPM_GLOBAL_BIN:$PATH"
          ocr version
          NATIVE="$(npm root -g)/@alibaba-group/ocr-linux-x64/bin/opencodereview"
          NESTED="$(npm root -g)/@alibaba-group/open-code-review/node_modules/@alibaba-group/ocr-linux-x64/bin/opencodereview"
          if [ ! -e "$NATIVE" ] && [ ! -e "$NESTED" ]; then
            echo "::error::ocr linux binary missing after install ($NATIVE / $NESTED)"
            exit 1
          fi

      - name: Run OpenCodeReview
        # Pin to release commit (v1.12.9). Bump intentionally; do not float on @main.
        uses: alibaba/open-code-review@bccbc15f785269400735d5255540c231e6c02b6d
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          ocr_version: 1.12.9
          node_version: "24"
          # Verified input at pinned SHA; 'medium' routes medium+low to summary.
          route_severity_below: medium
          # For issue_comment triggers, pass the resolved refs; for
          # pull_request_target the action resolves them from the event.
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}

      # Best-effort: review comments already posted. continue-on-error keeps the
      # job green, but every skip/failure emits ::warning:: so it shows in the
      # Actions UI / annotations (not silent).
      - name: Approve when findings are light
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          OCR_APPROVE_MAX_FINDINGS: ${{ vars.OCR_APPROVE_MAX_FINDINGS }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || steps.pr-context.outputs.head_sha }}
        with:
          script: |
            const fs = require('fs');
            // Contract from open-code-review@bccbc15 "Run OCR" step stdout redirect.
            const resultPath = '/tmp/ocr-result.json';

            try {
              if (!fs.existsSync(resultPath)) {
                core.warning('ocr-result.json missing; skipping approve decision');
                return;
              }

              let data;
              try {
                data = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
              } catch (err) {
                core.warning(`Failed to parse ocr-result.json: ${err.message}`);
                return;
              }

              const prNumber =
                context.payload.pull_request?.number || context.payload.issue?.number;
              if (!prNumber) {
                core.warning('No PR number; skipping approve');
                return;
              }

              const { data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });

              // Never auto-approve fork PRs or untrusted authors on pull_request_target.
              // Trusted authors can still get a bot APPROVE on their own PR — treat
              // that as intentional; require human review via branch protection.
              const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
              const headRepo = pull.head.repo?.full_name || '';
              if (headRepo !== baseRepo) {
                core.info(`Not approving: head repo ${headRepo || '(missing)'} is not ${baseRepo}`);
                return;
              }

              const trusted = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
              const prAssoc = String(pull.author_association || '').toUpperCase();
              if (!trusted.has(prAssoc)) {
                core.info(`Not approving: PR author association is ${prAssoc || 'unknown'}`);
                return;
              }

              const freshHead = String(pull.head.sha || '').trim();
              const expectedHead = String(process.env.EXPECTED_HEAD_SHA || '').trim();
              if (!expectedHead || !freshHead || expectedHead !== freshHead) {
                core.warning(
                  `Not approving: PR head moved (fresh=${freshHead || '(missing)'}, expected=${expectedHead || '(missing)'})`
                );
                return;
              }

              const reviewedHead = String(
                data?.manifest?.input?.resolved_head ||
                  data?.manifest?.input?.requested_head ||
                  ''
              ).trim();
              if (!reviewedHead || expectedHead !== reviewedHead) {
                core.warning(
                  `Not approving: reviewed head ${reviewedHead || '(missing)'} != expected ${expectedHead}`
                );
                return;
              }

              const comments = Array.isArray(data.comments) ? data.comments : [];
              const DEFAULT_MAX_LIGHT = 5;
              const parsed = parseInt(process.env.OCR_APPROVE_MAX_FINDINGS, 10);
              const maxLight = Math.max(0, Number.isNaN(parsed) ? DEFAULT_MAX_LIGHT : parsed);

              const severityOf = (c) => String(c.severity || '').toLowerCase();
              const isLight = (s) => s === 'low' || s === 'medium';
              const isSevere = (s) => s === 'high' || s === 'critical';

              const severities = comments.map(severityOf);
              const severe = severities.filter(isSevere);
              const unknown = severities.filter((s) => s && !isLight(s) && !isSevere(s));
              const emptySeverity = severities.filter((s) => !s);

              if (severe.length > 0 || unknown.length > 0 || emptySeverity.length > 0) {
                core.info(
                  `Not approving: severe=${severe.length} unknown=${unknown.length} empty=${emptySeverity.length} total=${comments.length}`
                );
                return;
              }
              if (comments.length > maxLight) {
                core.info(`Not approving: ${comments.length} light findings exceed max ${maxLight}`);
                return;
              }

              const body =
                comments.length === 0
                  ? 'OpenCodeReview found no issues — approving.'
                  : `OpenCodeReview found only low/medium findings (${comments.length} ≤ ${maxLight}) — approving.`;

              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                commit_id: expectedHead,
                event: 'APPROVE',
                body,
              });
              core.info(`Approved PR #${prNumber} at ${expectedHead}`);
            } catch (err) {
              const msg = String(err.message || err);
              if (msg.includes('not permitted to approve')) {
                core.warning(
                  `${msg} Enable Settings → Actions → General → ` +
                    '"Allow GitHub Actions to create and approve pull requests".'
                );
              } else {
                core.warning(`Approve step failed (non-fatal): ${msg}`);
              }
            }
