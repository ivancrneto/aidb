[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidb"
version = "0.1.0"
description = "Live-attach debugger for multi-agent apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
refund-desk = "samples.refund_desk.app:main"

[tool.setuptools.packages.find]
include = ["samples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
